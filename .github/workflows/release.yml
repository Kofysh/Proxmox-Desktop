name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '1.0'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (example: 1.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release tag
        id: resolve
        shell: pwsh
        run: |
          $proceed = 'true'
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -like 'refs/tags/*') {
            # Manual tag push: use the pushed tag.
            $tag = $env:GITHUB_REF_NAME
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            # Manual run: use the provided tag.
            $tag = '${{ inputs.tag_name }}'
          }
          else {
            # Push to master: derive the tag from the project version and
            # only release if that tag does not already exist.
            $csproj = Get-Content "Proxmox Desktop/ProxmoxDesktop.csproj" -Raw
            if ($csproj -notmatch '<InformationalVersion>([^<]+)</InformationalVersion>') {
              Write-Error "InformationalVersion not found in csproj"; exit 1
            }
            $version = $Matches[1].Trim()
            $tag = "v$version"
            git fetch --tags --quiet
            if (git tag -l $tag) {
              Write-Host "Tag $tag already exists - nothing to release."
              $proceed = 'false'
            }
            else {
              Write-Host "New version detected: $tag"
            }
          }
          "tag=$tag"          >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          "proceed=$proceed"  >> $env:GITHUB_OUTPUT
          Write-Host "Resolved tag=$tag proceed=$proceed"

      - name: Restore
        if: steps.resolve.outputs.proceed == 'true'
        run: dotnet restore "Proxmox Desktop/ProxmoxDesktop.csproj"

      - name: Publish (self-contained win-x64)
        if: steps.resolve.outputs.proceed == 'true'
        shell: pwsh
        run: |
          dotnet publish "Proxmox Desktop/ProxmoxDesktop.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=true `
            -p:WindowsAppSDKSelfContained=true `
            -o output/portable

      - name: Install Inno Setup
        if: steps.resolve.outputs.proceed == 'true'
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        if: steps.resolve.outputs.proceed == 'true'
        shell: pwsh
        run: |
          $env:Path += ';C:\Program Files (x86)\Inno Setup 6'
          $version = "${{ steps.resolve.outputs.tag }}".TrimStart('v')
          iscc "/DMyAppVersion=$version" installer/ProxmoxDesktop.iss

      - name: Create GitHub Release
        if: steps.resolve.outputs.proceed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.resolve.outputs.tag }}"
          $asset = "output/ProxmoxDesktop-${{ steps.resolve.outputs.version }}-setup-win-x64.exe"
          $notes = @'
          ## Installation
          **Installer:** download `ProxmoxDesktop-${{ steps.resolve.outputs.version }}-setup-win-x64.exe` and follow the wizard.

          > The installer is self-contained — no .NET installation required.

          ## Requirements
          - Windows 10 (build 17763+) or Windows 11
          - WebView2 Runtime
          - Virt-Viewer + UsbDk for SPICE
          '@
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesFile -Value $notes -Encoding utf8
          gh release create $tag $asset `
            --repo "${{ github.repository }}" `
            --title "Proxmox Desktop $tag" `
            --notes-file $notesFile `
            --generate-notes
