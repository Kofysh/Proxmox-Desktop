name: Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (example: v2.2.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release tag
        id: resolve
        shell: pwsh
        run: |
          $proceed = 'true'
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -like 'refs/tags/*') {
            # Manual tag push: use the pushed tag.
            $tag = $env:GITHUB_REF_NAME
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            # Manual run: use the provided tag.
            $tag = '${{ inputs.tag_name }}'
          }
          else {
            # Push to master: derive the tag from the project version and
            # only release if that tag does not already exist.
            $csproj = Get-Content "Proxmox Desktop/ProxmoxDesktop.csproj" -Raw
            if ($csproj -notmatch '<InformationalVersion>([^<]+)</InformationalVersion>') {
              Write-Error "InformationalVersion not found in csproj"; exit 1
            }
            $version = $Matches[1].Trim()
            $tag = "v$version"
            git fetch --tags --quiet
            if (git tag -l $tag) {
              Write-Host "Tag $tag already exists - nothing to release."
              $proceed = 'false'
            }
            else {
              Write-Host "New version detected: $tag"
            }
          }
          "tag=$tag"          >> $env:GITHUB_OUTPUT
          "proceed=$proceed"  >> $env:GITHUB_OUTPUT
          Write-Host "Resolved tag=$tag proceed=$proceed"

      - name: Restore
        if: steps.resolve.outputs.proceed == 'true'
        run: dotnet restore "Proxmox Desktop/ProxmoxDesktop.csproj"

      - name: Publish (self-contained win-x64)
        if: steps.resolve.outputs.proceed == 'true'
        shell: pwsh
        run: |
          dotnet publish "Proxmox Desktop/ProxmoxDesktop.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=true `
            -p:WindowsAppSDKSelfContained=true `
            -o output/portable

      - name: Build portable self-extracting executable
        if: steps.resolve.outputs.proceed == 'true'
        shell: pwsh
        run: |
          choco install 7zip --no-progress --yes
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          $sfx = 'C:\Program Files\7-Zip\7z.sfx'
          $archive = 'output\portable.7z'
          $config = 'output\portable-sfx-config.txt'
          $portable = 'output\ProxmoxDesktop-${{ steps.resolve.outputs.tag }}-portable-win-x64.exe'

          & $sevenZip a -t7z -mx=9 $archive '.\output\portable\*' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "7-Zip archive creation failed" }

          @"
          ;!@Install@!UTF-8!
          Title="Proxmox Desktop"
          RunProgram="ProxmoxDesktop.exe"
          ;!@InstallEnd@!
          "@ | Set-Content -LiteralPath $config -Encoding utf8NoBOM

          cmd /c "copy /b `"$sfx`" + `"$config`" + `"$archive`" `"$portable`""
          if ($LASTEXITCODE -ne 0) { throw "Self-extracting executable creation failed" }
          Remove-Item $archive, $config

      - name: Download Visual C++ runtime
        if: steps.resolve.outputs.proceed == 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe `
            -OutFile output/vc_redist.x64.exe

      - name: Install Inno Setup
        if: steps.resolve.outputs.proceed == 'true'
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        if: steps.resolve.outputs.proceed == 'true'
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.resolve.outputs.tag }}
        run: |
          $env:Path += ';C:\Program Files (x86)\Inno Setup 6'
          iscc /DMyAppVersion=${{ steps.resolve.outputs.tag }} installer/ProxmoxDesktop.iss

      - name: Create GitHub Release
        if: steps.resolve.outputs.proceed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: "Proxmox Desktop ${{ steps.resolve.outputs.tag }}"
          body: |
            ## 📦 Installation
            **Installer:** download `ProxmoxDesktop-${{ steps.resolve.outputs.tag }}-setup-win-x64.exe` and follow the wizard.

            **Portable:** download `ProxmoxDesktop-${{ steps.resolve.outputs.tag }}-portable-win-x64.exe` and run it directly. The application extracts its files temporarily and cleans them up when it closes.

            > Both packages are self-contained — no .NET installation required.

            ## Requirements
            - Windows 10 (build 17763+) or Windows 11
            - [WebView2 Runtime](https://developer.microsoft.com/en-us/microsoft-edge/webview2/) *(pre-installed on Windows 11)*
            - [Virt-Viewer + UsbDk](https://www.spice-space.org/download.html) *(SPICE only)*
          files: |
            output/ProxmoxDesktop-${{ steps.resolve.outputs.tag }}-portable-win-x64.exe
            output/ProxmoxDesktop-${{ steps.resolve.outputs.tag }}-setup-win-x64.exe
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.resolve.outputs.tag, '-beta') || contains(steps.resolve.outputs.tag, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
